# Starter enterprise-style orchestration for the Multi-Agent Medical Assistant.
#
# Services:
#   - redis : shared LangGraph checkpointer / session store / cache / rate-limit
#             / Celery broker (multi-worker state sharing + HITL persistence)
#   - qdrant: vector database for the RAG knowledge base
#   - minio : S3-compatible object storage for uploads / segmentation outputs (P2)
#   - app   : the FastAPI application served by gunicorn + Uvicorn workers
#   - worker: Celery worker for async heavy jobs (RAG ingestion) (P2)
#   - nginx : reverse proxy / load balancer with SSE-friendly buffering disabled
#
# Usage:
#   docker compose up --build
#   (fill in .env first; see .env.example)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "medical"
      POSTGRES_PASSWORD: "medical"
      POSTGRES_DB: "medical_assistant"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Share session state / cache / rate-limit / broker via Redis.
      CHECKPOINTER_BACKEND: "redis"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      WORKERS: "2"
      DEBUG: "false"
      # P2: caching + rate limiting + async queue on the full stack.
      ENABLE_CACHE: "true"
      ENABLE_RATE_LIMIT: "true"
      ENABLE_TASK_QUEUE: "true"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      # P2: object storage via MinIO (degrades to local disk if unreachable).
      OBJECT_STORAGE_BACKEND: "s3"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_BUCKET: "medical-assistant"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      # P3: auth + compliance on PostgreSQL (set ENABLE_AUTH=true to enforce).
      DATABASE_URL: "postgresql+psycopg2://medical:medical@postgres:5432/medical_assistant"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "services.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      OBJECT_STORAGE_BACKEND: "s3"
      S3_ENDPOINT_URL: "http://minio:9000"
      S3_BUCKET: "medical-assistant"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  redis_data:
  qdrant_data:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:
