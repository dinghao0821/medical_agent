name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff, non-blocking)
        run: ruff check . || true

      - name: Syntax check
        run: python -m compileall -q services agents app.py config.py

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Agent quality gate (offline injection-defence eval)
        # Fully offline (no LLM creds); fails the build if the injection filter
        # regresses below threshold. Live routing eval is intentionally omitted
        # here since it needs model credentials.
        run: python -m evaluation.run_eval --min-injection 0.9

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    # Heavy (torch); only on pushes to the default branches. Does not publish.
    if: github.event_name == 'push'
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t medical-assistant:ci .
        continue-on-error: true
