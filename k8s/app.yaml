# FastAPI application: stateless Deployment (horizontally scalable) + Service.
# Per-session state lives in Redis (checkpointer), so replicas are safe.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: medical-assistant
  labels:
    app: medical-app
spec:
  replicas: 3
  # Zero-downtime rolling update: bring up new pods before removing old ones.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medical-app
  template:
    metadata:
      labels:
        app: medical-app
        version: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: app
          image: medical-assistant:latest   # overridden by kustomize images
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: medical-config
            - secretRef:
                name: medical-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          # Give in-flight requests (slow LLM/inference) time to finish on rollout.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: medical-assistant
  labels:
    app: medical-app
spec:
  selector:
    app: medical-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
