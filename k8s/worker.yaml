# Celery worker for async heavy jobs (RAG ingestion). Scales independently of the
# API. Uses the same image; overrides the command to run the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: medical-assistant
  labels:
    app: medical-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-worker
  template:
    metadata:
      labels:
        app: medical-worker
    spec:
      containers:
        - name: worker
          image: medical-assistant:latest   # overridden by kustomize images
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "services.celery_app:celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: medical-config
            - secretRef:
                name: medical-secrets
          readinessProbe:
            exec:
              command: ["sh", "-c", "celery -A services.celery_app:celery_app inspect ping -d celery@$HOSTNAME"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      terminationGracePeriodSeconds: 60
