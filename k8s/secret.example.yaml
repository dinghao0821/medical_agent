# Copy to secret.yaml and fill in real values, then: kubectl apply -f secret.yaml
# (secret.yaml is git-ignored; never commit real secrets.)
apiVersion: v1
kind: Secret
metadata:
  name: medical-secrets
  namespace: medical-assistant
type: Opaque
stringData:
  # LLM / tools
  OPENAI_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  TAVILY_API_KEY: ""
  HUGGINGFACE_TOKEN: ""
  ELEVEN_LABS_API_KEY: ""

  # Auth / compliance
  JWT_SECRET: "change-me-in-production"
  AUDIT_ENCRYPTION_KEY: ""

  # Object storage (MinIO/S3)
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"

  # Observability (optional)
  LANGSMITH_API_KEY: ""
