# Reverse proxy / load balancer for the Multi-Agent Medical Assistant.
#
# Key points:
#   - upstream can list multiple app replicas for horizontal scaling.
#   - SSE endpoint (/chat/stream) disables proxy buffering so tokens are flushed
#     to the client immediately.
#   - upload and long-running LLM calls get generous body size / timeouts.

upstream medical_app {
    # Add more "server app_2:8000;" lines (or scale the app service) to load-balance.
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow medical image uploads (keep in sync with MAX_IMAGE_UPLOAD_SIZE).
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generous timeouts for slow LLM / model inference calls.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Server-Sent Events: stream tokens without buffering.
    location /chat/stream {
        proxy_pass http://medical_app;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://medical_app;
    }
}
